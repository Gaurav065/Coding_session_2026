<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Web Player Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="logo">
                <!-- Using a simple SVG logo resembling a music player -->
                <svg viewBox="0 0 24 24" fill="currentColor" width="32" height="32">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.6 14.6c-.2.32-.61.42-.93.22-2.54-1.55-5.74-1.9-9.52-1.04-.37.08-.74-.15-.82-.52-.08-.37.15-.74.52-.82 4.14-.94 7.67-.55 10.53 1.2.33.2.43.62.22.95zm1.32-3.14c-.25.4-.77.53-1.16.28-2.9-1.78-7.38-2.33-10.74-1.27-.45.14-.92-.1-1.06-.55-.14-.45.1-.92.55-1.06 3.86-1.2 8.84-.6 12.14 1.43.38.25.5.76.27 1.17zm.1-3.32c-3.46-2.06-9.17-2.25-12.47-1.25-.54.16-1.1-.14-1.26-.68-.16-.54.14-1.1.68-1.26 3.8-1.15 10.1-.92 14.07 1.44.48.29.63.92.34 1.4-.29.49-.92.65-1.4.35z"></path>
                </svg>
                <span>Spotify</span>
            </div>
            <ul class="nav-links">
                <li class="active" id="nav-home"><a href="#">Home</a></li>
                <li><a href="#">Search</a></li>
                <li id="nav-library"><a href="#">Your Library</a></li>
            </ul>
            <div class="divider"></div>
            <ul class="nav-links">
                <li><a href="#">Create Playlist</a></li>
                <li id="nav-liked"><a href="#">Liked Songs</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="nav-arrows">
                    <button>&lt;</button>
                    <button>&gt;</button>
                </div>
                <div class="user-profile">
                    <button id="auth-btn">Log in / Premium</button>
                </div>
            </header>
            
            <section class="content-section">
                <h2 id="section-title">Your Top Tracks</h2>
                <div class="tracks-grid" id="top-tracks-container">
                    <!-- Tracks will be injected here via JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Playback Bar -->
    <footer class="player-bar">
        <div class="now-playing" id="now-playing-info">
            <img id="np-image" src="https://via.placeholder.com/56" alt="Album Art">
            <div class="np-details">
                <div class="np-title" id="np-title">Connecting to Spotify...</div>
                <div class="np-artist" id="np-artist">Please wait</div>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-buttons">
                <button id="btn-prev" class="control-btn">⏮</button>
                <button id="btn-toggle-play" class="control-btn play-btn">▶️</button>
                <button id="btn-next" class="control-btn">⏭</button>
            </div>
            <div class="playback-bar">
                <span class="time-current">0:00</span>
                <div class="progress-bar">
                    <div class="progress" id="progress-fill"></div>
                </div>
                <span class="time-total">0:00</span>
            </div>
        </div>

        <div class="extra-controls">
            <button class="control-btn">🔊</button>
            <div class="volume-bar">
                <div class="volume-progress"></div>
            </div>
        </div>
    </footer>

    <script src="app.js" type="module"></script>
</body>
</html>
